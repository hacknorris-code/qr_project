<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q-Random code generator</title>
<meta name="description" content="double q-random code generator">
<style>
body { font-family: system-ui, sans-serif; padding: 2.5px; background: #f0f0f0; }
input, button { padding: 5px; font-size: 16px; margin: 4px; }
svg { background: none; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
</style>
</head>
<body style="display:flex; flex-direction:column; align-items:center; align-content:center;">
<div style="display:grid">
<div id="output" style="grid-area:1/1; margin-top: 20px; "></div>
<div id="output2" style="grid-area:1/1; margin-top: 20px; "></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<script>
default_light = 0.18; // 0-black , 0.18 - perfect mid/4.5 contrast, 1 - white
function hslToRgb(h, s, l) {
s /= 100;
l /= 100;

const k = n => (n + h / 30) % 12;
const a = s * Math.min(l, 1 - l);

const f = n =>
l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));

return [
Math.round(255 * f(0)),
Math.round(255 * f(8)),
Math.round(255 * f(4))
];
}

// luminance
function luminance([r, g, b]) {
const srgb = [r, g, b].map(v => {
v /= 255;
return v <= 0.03928
? v / 12.92
: Math.pow((v + 0.055) / 1.055, 2.4);
});

return 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
}

// find color with target luminance
function colorFromHueWithContrast(hue, saturation = 100, targetLuminance = 0.18) {
let best = null;
let bestDiff = Infinity;

for (let l = 0; l <= 100; l += 0.1) {
const rgb = hslToRgb(hue, saturation, l);
const lum = luminance(rgb);

const diff = Math.abs(lum - targetLuminance);

if (diff < bestDiff) {
bestDiff = diff;
best = { rgb, l, lum };
}
}

return best;
}

// helper: rgb → css
function rgbToCss([r, g, b]) {
return `rgb(${r}, ${g}, ${b})`;
}

const fg = Math.random()*360
const bg = Math.random()*360

let qr1, qr2;
let gridSize;           // module count
let cellSize = 20;      // visual size
let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 8 };
let gravity = { x: 0, y: 0 };
let held=0;
let gameRunning = true;

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');

function findFreeCell(reverse) {
  const offset = 4 * cellSize;
  const r = reverse ? (gridSize - 1) : 0;
  const cStart = reverse ? (gridSize - 1) : 0;
  for (let row = r; row >= 0 && row < gridSize; row += reverse ? -1 : 1) {
    for (let col = cStart; col >= 0 && col < gridSize; col += reverse ? -1 : 1) {
      if (!qr1.isDark(row, col) && !qr2.isDark(row, col)) {
      return {
        x: offset + col * cellSize + cellSize / 2,
        y: offset + row * cellSize + cellSize / 2
      };
      }
    }
  }
  return null;
}

let goal;
// console.log(goal)

function initGame(text1 = "0", text2 = "1") {
qr1 = qrcode(0, 'H'); qr1.addData(text1); qr1.make();
qr2 = qrcode(0, 'H'); qr2.addData(text2); qr2.make();

gridSize = qr1.getModuleCount();
const total = (gridSize + 8) * cellSize; // + quiet zone

canvas.width = total;
canvas.height = total;
document.getElementById('output').innerHTML = ''; // clear old SVGs
document.getElementById('output').appendChild(canvas);

// Start ball near top-left (avoid quiet zone)

const start = findFreeCell(false);
if (!start) { alert("No open cell found — try different QR texts!"); return; }
ball.x = start.x;
ball.y = start.y;
ball.vx = 0;
ball.vy = 0;
goal = findFreeCell(true);
drawBoard();
requestAnimationFrame(gameLoop);
}

// Draw the beautiful double-QR background + walls
function drawBoard() {
ctx.clearRect(0, 0, canvas.width, canvas.height);

const offset = 4 * cellSize;

// Background (from original)
const bgColor = rgbToCss(colorFromHueWithContrast(bg, 75, 0.5).rgb);
ctx.fillStyle = bgColor;
ctx.fillRect(0, 0, canvas.width, canvas.height);

const fgColor1 = rgbToCss(colorFromHueWithContrast(fg, 75, 0.2).rgb);

for (let row = 0; row < gridSize; row++) {
for (let col = 0; col < gridSize; col++) {
const x = offset + col * cellSize;
const y = offset + row * cellSize;
const darkA = qr1.isDark(row, col);
const darkB = qr2.isDark(row, col);

if (darkA && darkB) {
// Solid wall
ctx.fillStyle = fgColor1;
ctx.fillRect(x, y, cellSize, cellSize);
} else if (darkA) {
// Split like original QR1
ctx.fillStyle = fgColor1;
ctx.fillRect(x, y, cellSize/2, cellSize/2);
ctx.fillRect(x + cellSize/2, y + cellSize/2, cellSize/2, cellSize/2);
} else if (darkB) {
// Split like original QR2 (complementary)
ctx.fillStyle = fgColor1;
ctx.fillRect(x, y + cellSize/2, cellSize/2, cellSize/2);
ctx.fillRect(x + cellSize/2, y, cellSize/2, cellSize/2);
}
// else: empty path (maybe light grid lines)
}
}
}

// Simple physics + collision
function updatePhysics() {
if (!gameRunning) {console.log("eee");return;};
const friction = 0.92;
const bounce = 0.6;

ball.vx += gravity.x * 0.25;
ball.vy += gravity.y * 0.25;

ball.vx *= friction;
ball.vy *= friction;

// Move X then Y (simple collision)
let nextX = ball.x + ball.vx;
let nextY = ball.y + ball.vy;

if(!held){
if (isWall(nextX, ball.y)) {
ball.vx = -ball.vx * bounce;
nextX = ball.x;
}
if (isWall(ball.x, nextY)) {
ball.vy = -ball.vy * bounce;
nextY = ball.y;
}
if (isWall(nextX, nextY)) {
ball.vx = -ball.vx * bounce;
ball.vy = -ball.vy * bounce;
}
}else{
if (!isWall(nextX, ball.y)) {
ball.vx = -ball.vx * bounce;
nextX = ball.x;
}
if (!isWall(ball.x, nextY)) {
ball.vy = -ball.vy * bounce;
nextY = ball.y;
}
if (!isWall(nextX, nextY)) {
ball.vx = -ball.vx * bounce;
ball.vy = -ball.vy * bounce;
}
}

ball.x = nextX;
ball.y = nextY;

// Goal check (example: bottom right)
// ...then in the distance check:
if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < cellSize * 1.5) {
gameRunning = false;
}
}

function isWall(x, y) {
const offset = 4 * cellSize;
const col = Math.floor((x - offset) / cellSize);
const row = Math.floor((y - offset) / cellSize);

if (row < 0 || row >= gridSize || col < 0 || col >= gridSize) return true;

const darkA = qr1.isDark(row, col);
const darkB = qr2.isDark(row, col);
return darkA || darkB; // both types are walls
}

function drawBall() {
ctx.save();
ctx.shadowBlur = 12;
ctx.shadowColor = 'rgba(255,255,255,0.9)';
ctx.fillStyle = '#ff0';
ctx.beginPath();
ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle="#888"
ctx.fillRect(goal.x , goal.y , goal.x , goal.y )
ctx.restore();
}

let keys = {};

function handleOrientation(e) {
gravity.x = e.gamma / 15;   // left-right
gravity.y = e.beta / 15;    // front-back
}
window.addEventListener('click',async()=>{
      if(DeviceOrientationEvent?.requestPermission)
      try{await DeviceOrientationEvent.requestPermission()}catch(e){}
      });
window.addEventListener('deviceorientation', handleOrientation);

window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);
window.addEventListener("pointerdown", e => held=1)
window.addEventListener("pointerup", e=> held=0)

function updateInput() {
gravity.x = 0;
gravity.y = 0;

if (keys.ArrowLeft)  gravity.x--;
if (keys.ArrowRight) gravity.x++;
if (keys.ArrowUp)    gravity.y--;
if (keys.ArrowDown)  gravity.y++;
}

function gameLoop() {
updateInput();
updatePhysics();
drawBoard();
drawBall();
requestAnimationFrame(gameLoop);
}

// Start
window.onload = () => {
initGame(String(Math.random()*1_000_000), String(Math.random()*1_000_000)); // change texts!
};
</script>
</body>
</html>
