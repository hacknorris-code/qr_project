<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q-Random code generator</title>
  <meta name="description" content="double q-random code generator">
  <style>
    body { font-family: system-ui, sans-serif; padding: 2.5px; background: #f0f0f0; }
    input, button { padding: 5px; font-size: 16px; margin: 4px; }
    svg { background: none; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
  </style>
</head>
<body style="display:flex; flex-direction:column; align-items:center; align-content:center;">
<h1 style="margin:5px">Q-Random code generator</h1>
<div style="display:flex; flex-direction:column; align-items:center; align-content:center;">

  <div>first code text: <input type="text" id="text1" placeholder="Enter text (e.g. Hello World)" style="width:400px;"></div> <!--135-->
  <div>second code text: <input type="text" id="text2" placeholder="Enter text (e.g. Hello World)" style="width:400px;"></div>
  <hr width="100%">
  <div>third code text: <input type="text" id="text3" placeholder="Enter text (e.g. Hello World)" style="width:400px;"></div> <!--315-->
  <div>fourth code text: <input type="text" id="text4" placeholder="Enter text (e.g. Hello World)" style="width:400px;"></div>
  <hr width="100%">
  <div> background hue (from 0 to 360): <input type=number id=bg> foreground hue (from 0 to 360): <input type=number id=fg> contrast: <input type=number id=contrast></div>
  <button onclick="gen();">Generate code</button><button onclick="exportMixedQRToPNG()">Download code</button>
  </div>
  <div id=out>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <script>
  default_light = 0.18; // 0-black , 0.18 - perfect mid/4.5 contrast, 1 - white
  function hslToRgb(h, s, l) {
    s /= 100;
    l /= 100;

    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);

    const f = n =>
      l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));

    return [
      Math.round(255 * f(0)),
      Math.round(255 * f(8)),
      Math.round(255 * f(4))
    ];
  }

  // luminance
  function luminance([r, g, b]) {
    const srgb = [r, g, b].map(v => {
      v /= 255;
      return v <= 0.03928
        ? v / 12.92
        : Math.pow((v + 0.055) / 1.055, 2.4);
    });

    return 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
  }

  // find color with target luminance
  function colorFromHueWithContrast(hue, saturation = 100, targetLuminance = 0.18) {
    let best = null;
    let bestDiff = Infinity;

    for (let l = 0; l <= 100; l += 0.1) {
      const rgb = hslToRgb(hue, saturation, l);
      const lum = luminance(rgb);

      const diff = Math.abs(lum - targetLuminance);

      if (diff < bestDiff) {
        bestDiff = diff;
        best = { rgb, l, lum };
      }
    }

    return best;
  }

  // helper: rgb → css
  function rgbToCss([r, g, b]) {
    return `rgb(${r}, ${g}, ${b})`;
  }
  
  t = contrast.value / 9;
  Lfg = 0.5 + 0.45 * (t * 2 - 1);
  Linv = 0.5 - 0.45 * (t * 2 - 1);
  normalLum = Math.max(0, Math.min(1, Lfg));
  invertLum = Math.max(0, Math.min(1, Linv));

function generateSVG(suffix,invertLum) {
  const text = document.getElementById(`text${suffix}`).value.trim() || "Hello QR!";

  const qr = qrcode(0, 'H');
  qr.addData(text);
  qr.make();

  const moduleCount = qr.getModuleCount();
  const s = 8; // consolidated moduleSize * scale
  const totalSize = (moduleCount) * s; // 8 is quiet zone (4 * 2)

  let svgHTML = ``;
  const offset = 4 * s; // 4 modules quiet zone
  const fillStyle = rgbToCss(colorFromHueWithContrast(fg.value, 75, invertLum).rgb);
  const half = s / 2;

  for (let row = 0; row < moduleCount; row++) {
    for (let col = 0; col < moduleCount; col++) {
      if (qr.isDark(row, col)) {
        const x = offset + col * s;
        const y = offset + row * s;
        
        // If suffix is empty (''), use top-left/bottom-right corners. Otherwise, use bottom-left/top-right.
        const y1 = suffix%2 === 1 ? y : y + half;
        const y2 = suffix%2 === 1 ? y + half : y;

        svgHTML += `
          <rect x="${x}" y="${y1}" width="${half}" height="${half}" fill="${fillStyle}"/>
          <rect x="${x + half}" y="${y2}" width="${half}" height="${half}" fill="${fillStyle}"/>
        `;
      }
    }
  }

  return [totalSize,svgHTML];
}
function gen(){
  t = contrast.value / 9;
  Lfg = 0.5 + 0.45 * (t * 2 - 1);
  Linv = 0.5 - 0.45 * (t * 2 - 1);
  normalLum = Math.max(0, Math.min(1, Lfg));
  invertLum = Math.max(0, Math.min(1, Linv));

  q1=generateSVG('1',invertLum);
  q2=generateSVG('2',invertLum);
  q3=generateSVG('3',invertLum);
  q4=generateSVG('4',invertLum);
  size=2*(Math.max(q1[0],q2[0],q3[0],q4[0]))
  w=(Math.sqrt(2)*size)+64;h=(Math.sqrt(2)*size)/2+64
  out.innerHTML = `
  <svg
  width="${w}"
  height="${h}"
  viewBox="0 0 ${w} ${h}"
  xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="${rgbToCss(colorFromHueWithContrast(bg.value, 75, normalLum).rgb)}"/>
  <g transform="translate(${w/2 + Math.sqrt(2)*8*8},${h/2}) rotate(135)">${q1[1]}</g>
  <g transform="translate(${w/2 + Math.sqrt(2)*8*8},${h/2}) rotate(135)">${q2[1]}</g>
  <g transform="translate(${w/2 - Math.sqrt(2)*8*7},${h/2}) rotate(315)">${q3[1]}</g>
  <g transform="translate(${w/2 - Math.sqrt(2)*8*7},${h/2}) rotate(315)">${q4[1]}</g>
</svg>
  `
}
    // Demo on load
    window.onload = () => {
      document.getElementById('text1').value = "00";
      document.getElementById('text2').value = "01";
      document.getElementById('text3').value = "10";
      document.getElementById('text4').value = "11";
      gen();
    };
    function exportMixedQRToPNG() {
  // 1. Grab both SVG elements from your output containers
  const svg = document.getElementById('out').querySelector('svg');

  if (!svg) {
    alert("Please generate the QR codes first!");
    return;
  }

  // 2. Get dimensions from the primary SVG
  const width = svg.getAttribute('width');
  const height = svg.getAttribute('height');

  // 3. Create a canvas element
  const canvas = document.createElement('canvas');
  canvas.width = parseInt(width);
  canvas.height = parseInt(height);
  const ctx = canvas.getContext('2d');

  // 4. Convert SVG elements to strings and XML data URLs
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);

  const img1 = new Image();

  // Create standard Data URLs (using encodeURIComponent is safer than btoa for special characters)
  img1.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);

  // 5. Layer them sequentially onto the canvas once loaded
  img1.onload = () => {
    ctx.drawImage(img1, 0, 0); // Draw background + base QR pattern

      const pngUrl = canvas.toDataURL('image/png');
      const downloadLink = document.createElement('a');
      downloadLink.href = pngUrl;
      downloadLink.download = 'q-random_code.png';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
  };
}
  </script>
</body>
</html>
